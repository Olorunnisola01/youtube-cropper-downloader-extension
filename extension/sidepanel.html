<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Cropper</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 4px;
      height: 100%;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.ok { background: #2ecc71; }
    .dot.down { background: #cc0000; }

    /* --- Job tab strip --- */
    #tabBar {
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid #262626;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    #tabStrip {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: thin;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #1c1c1c;
      border: 1px solid #2c2c2c;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      color: #ccc;
    }
    .tab.active {
      background: #2a1010;
      border-color: #cc0000;
      color: #fff;
    }
    .tab .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .tab .status-dot.downloading { background: #f0a020; animation: pulse 1s infinite; }
    .tab .status-dot.done { background: #2ecc71; }
    .tab .status-dot.error { background: #cc0000; }
    .tab .status-dot.cancelled { background: #666; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .tab .close-x {
      color: #888;
      font-size: 13px;
      line-height: 1;
      padding: 0 2px;
    }
    .tab .close-x:hover { color: #fff; }

    #newTabBtn, #stopAllBtn {
      flex-shrink: 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      padding: 6px 10px;
    }
    #newTabBtn {
      background: #262626;
      color: #ccc;
    }
    #newTabBtn:hover { background: #333; }
    #stopAllBtn {
      background: #402020;
      color: #ff9a9a;
    }
    #stopAllBtn:hover { background: #552a2a; }
    #stopAllBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* --- Job form --- */
    label {
      display: block;
      font-size: 12px;
      margin-top: 10px;
      color: #aaa;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-top: 4px;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
    }
    .video-title {
      font-size: 12px;
      color: #ccc;
      margin-top: 4px;
      line-height: 1.4;
      max-height: 3.6em;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row > div {
      flex: 1;
    }
    button.primary {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #cc0000;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary:hover { background: #a30000; }
    button.primary:disabled {
      background: #444;
      cursor: not-allowed;
    }
    button.secondary {
      width: 100%;
      background: #333;
      margin-top: 8px;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      padding: 9px;
    }
    button.secondary:hover { background: #444; }
    button.cancel {
      width: 100%;
      background: #402020;
      color: #ff9a9a;
      margin-top: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      padding: 9px;
    }
    button.cancel:hover { background: #552a2a; }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #262626;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }
    .progress-track.visible { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #cc0000;
      transition: width 0.3s ease;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #ccc;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .downloads-link {
      margin-top: auto;
      padding-top: 16px;
      font-size: 11px;
      color: #666;
      border-top: 1px solid #262626;
    }

    #jobPanel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1><span id="serverDot" class="dot"></span> YouTube Cropper</h1>

  <div id="tabBar">
    <div id="tabStrip"></div>
    <button id="newTabBtn" title="Start a new crop job">+ New</button>
    <button id="stopAllBtn" title="Cancel every running job">Stop All</button>
  </div>

  <div id="jobPanel">
    <div class="video-title" id="videoTitle"></div>

    <label>Video URL</label>
    <input id="url" placeholder="https://www.youtube.com/watch?v=..." />

    <div class="row">
      <div>
        <label>Start (hh:mm:ss)</label>
        <input id="start" placeholder="0:00:00" />
      </div>
      <div>
        <label>End (hh:mm:ss)</label>
        <input id="end" placeholder="0:00:30" />
      </div>
    </div>

    <button id="useCurrent" class="secondary">Use current playback time as Start</button>

    <label>Output filename (no extension)</label>
    <input id="filename" placeholder="e.g. xxx" />

    <label>Quality</label>
    <select id="quality">
      <option value="best">Best available (video+audio merged)</option>
      <option value="2160">Up to 4K (2160p)</option>
      <option value="1440">Up to 1440p</option>
      <option value="1080">Up to 1080p</option>
      <option value="720">Up to 720p</option>
    </select>

    <button id="crop" class="primary">Download Cropped Clip</button>
    <button id="cancelJob" class="cancel" style="display:none;">Cancel This Job</button>
    <button id="saveAs" class="secondary" style="display:none;">Save As...</button>

    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="status"></div>

    <div class="downloads-link">Clips are also kept in YouTubeCropper/downloads until you Save As elsewhere</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
